name: Release to PyPI

on:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  smoke-test:
    name: Smoke Test Before Release
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up UV
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "**/pyproject.toml,**/uv.lock"

    - name: Set up Python
      run: uv python install ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: uv sync --dev

    - name: Smoke test
      run: |
        uv run python -c "from music21_mcp.services import MusicAnalysisService; s=MusicAnalysisService(); assert len(s.get_available_tools()) >= 10"
        uv run python -c "from music21_mcp.adapters.http_adapter import main; print('http entry point OK')"

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: smoke-test
    if: github.ref == 'refs/heads/main'
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up UV
      uses: astral-sh/setup-uv@v7

    - name: Set up Python
      run: uv python install ${{ env.PYTHON_VERSION }}

    - name: Install semantic-release
      run: uv pip install python-semantic-release

    - name: Semantic Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        semantic-release publish
